    provider: here-now
    inherit_connection: owner:provider:here-now
    lifecycle: live
    static_primary: true
    slug: mighty-ether-p6cn
    url: https://mighty-ether-p6cn.here.now/
    current_version_id: 01M3CYXN5PEGPPR2Y3MJ0MJN7Y
    source_ref: 56bba49efb98679053c7753003c857ea9651a292
    canonical_routes:
      - /
      - /app/
      - /context/
      - /bridge/connect/
      - /meos/
      - /lab/interview/
    legacy_aliases:
      /variants/interview-shell/: /lab/interview/
      /variants/dossier/: /meos/
      /variants/context-portability/: /context/
      /variants/connect-loop/: /bridge/connect/
    verification:
      state: verified
      evidence_refs:
        - "build: scripts/sandbox-build.sh completed one canonical dist/client inventory, content-marker, and static-backend-guard check"
        - "desktop browser: root, /app/, /context/, /bridge/connect/, /meos/, and /lab/interview/ rendered with no console errors"
        - "desktop browser: /lab/interview/ displayed the recovered immersive shell and its explicit unavailable-server boundary"
        - "browser continuity: /variants/interview-shell/ resolved to /lab/interview/; Dossier, Context Portability, and Connect Loop legacy aliases resolved to their canonical routes"
        - "mobile browser (390x844): root and /lab/interview/ rendered with responsive navigation and no console errors"
        - "here.now permanent update: mighty-ether-p6cn version 01M3CYXN5PEGPPR2Y3MJ0MJN7Y"
    notes:
      - "Static UI build only. Sign-in, database, payments and API routes are unavailable in this sandbox and are not simulated."
      - "Canonical source is sandbox/review. Build once with scripts/sandbox-build.sh and publish only dist/client to the same slug; never create a replacement site."
      - "A permanent-slug publish must contain the complete canonical sandbox. Partial route or historical-variant publishes are prohibited."
      - "scripts/sandbox-verify.mjs runs from scripts/sandbox-build.sh and fails when a required route, expected content marker, or static-backend guard is missing."
      - "Verification recorded 2026-09-25 against the permanent site: desktop and 390x844 mobile browser renders proved the required routes and explicit static backend boundary."

historical_variant_dispositions:
  interview_shell:
    source_ref: d9633ed04f88e99169af67364df97c6a4bbd1e5c
    status: ported
    canonical_route: /lab/interview/
    legacy_route: /variants/interview-shell/
    notes: "Retains the immersive Interview Engine Lab direction as a truthful static shell; generation, authentication, Context writes, and persistence remain server-backed."
  dossier:
    status: archived_reference
    canonical_route: /meos/
    legacy_route: /variants/dossier/
    notes: "The branch's product-wide Dossier rename is not merged into the canonical sandbox; its legacy URL redirects to the current Reflect surface."
  context_portability:
    status: archived_reference
    canonical_route: /context/
    legacy_route: /variants/context-portability/
    notes: "The branch was a homepage-positioning experiment, not an independent durable surface."
  connect_loop:
    status: archived_reference
    canonical_route: /bridge/connect/
    legacy_route: /variants/connect-loop/
    notes: "The branch contains server-backed Bridge proposal work and is not merged into the static sandbox; its legacy URL redirects to the current Connect surface."

rules:
  - sandbox-state-never-implies-production-state
  - sandbox-credentials-are-owner-level-or-external-secret-references-never-inline
  - stable-sandbox-slug-is-preferred-over-disposable-preview-urls
  - permanent-here-now-publishes-must-contain-the-complete-canonical-sandbox
  - historical-variant-branches-are-recovery-references-not-publish-sources
  - record-source-ref-and-verification-evidence-for-each-sandbox-version
  - browser-test-accounts-remain-product-specific-and-separate-from-provider-ownership
