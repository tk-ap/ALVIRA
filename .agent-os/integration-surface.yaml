version: 0.2.0
product_key: alvira-meos
agent_os_repository: tk-ap/agent-os
routing_source: registry/product-routing.yaml

inbound:
  - from: agent-os-workforce
    contract: contracts/outcome-event.schema.json
    purpose: review verified outcomes as candidate context updates; never auto-ingest without ALVIRA rules
  - from: agent-os-workforce
    contract: contracts/context-signal.schema.json
    purpose: review execution observations that may indicate stale, contradicted, ambiguous, missing, or over-broad context; never treat an agent observation as confirmed context

outbound:
  - to: agent-os-workforce
    contract: contracts/work-item.schema.json
    trigger: a user-approved ALVIRA job is intentionally handed to governed execution
  - to: agent-os-workforce
    contract: contracts/context-envelope.schema.json
    trigger: governed work needs approved least-privilege ALVIRA context
  - to: alvira-bridge
    contract: contracts/context-envelope.schema.json
    trigger: approved ALVIRA context needs controlled delivery to an external tool

cross_market:
  - trigger: a context observation becomes a portfolio-priority question
    destination: ailhat
    message: Route the portfolio-level question to Portfolio Intelligence rather than prioritizing it inside ALVIRA.

rules:
  use_portable_contracts_for_cross_product_handoffs: true
  cross_market_policy: policies/CROSS_MARKET_POLICY.md
  integration_claims_require_verified_implementation: true
  context_delivery_does_not_grant_execution_authority: true
  commercial_entitlement_does_not_grant_execution_authority: true
  execution_observations_require_reflect_review_before_durable_context_change: true
  agent_os_remains_host_and_context_provider_agnostic: true
  alvira_native_execution_must_not_block_portable_export_to_other_harnesses: true
  no_live_ui_pricing_entitlement_or_execution_change_authorized_by_this_manifest: true
