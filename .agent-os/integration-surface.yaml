version: 0.2.0
product_key: alvira-meos
agent_os_repository: tk-ap/agent-os
routing_source: registry/product-routing.yaml

inbound:
  - from: agent-os-workforce
    contract: contracts/outcome-event.schema.json
    purpose: review verified outcomes as candidate context updates; never auto-ingest without ALVIRA rules

outbound:
  - to: agent-os-workforce
    contract: contracts/context-envelope.schema.json
    trigger: governed work needs approved ALVIRA context
  - to: alvira-bridge
    contract: contracts/context-envelope.schema.json
    trigger: an approved ALVIRA Context view needs controlled delivery to an external AI tool

customer_flow:
  canonical: interview once -> maintain living Context -> Connect ALVIRA -> approve Context view -> destination reads approved Context
  customer_facing_name: Connect ALVIRA
  delivery_infrastructure: ALVIRA Bridge
  preferred_paths:
    - native-plugin-or-connector-when-verified
    - bridge-remote-connection
    - bridge-api-for-custom-integrations
    - reviewed-portable-context-fallback
  prohibited_shortcuts:
    - destination-specific-context-store
    - silent-context-writeback
    - manual-bearer-token-copy-in-normal-flow
    - unverified-named-integration-claims

cross_market:
  - trigger: a context observation becomes a portfolio-priority question
    destination: ailhat
    message: Route the portfolio-level question to Portfolio Intelligence rather than prioritizing it inside ALVIRA.

rules:
  use_portable_contracts_for_cross_product_handoffs: true
  cross_market_policy: policies/CROSS_MARKET_POLICY.md
  integration_claims_require_verified_implementation: true
  context_delivery_does_not_grant_execution_authority: true
  external_destinations_may_read_only_explicitly_approved_context: true
  canonical_connected_context_direction: docs/ALVIRA_CONNECT_DIRECTION.md
