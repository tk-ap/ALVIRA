version: 0.2.0
product_key: alvira-meos
agent_os_repository: tk-ap/agent-os
routing_source: registry/product-routing.yaml
repository: tk-ap/ALVIRA

local:
  owns:
    - context-capture
    - context-structure
    - living-context-maintenance
    - reflection
    - alvira-profile-source-of-truth
    - connected-context-experience
    - nested-bridge-user-experience
  produces:
    - approved-context
    - approved-context-view
    - provenanced-context
    - context-reference
    - context-update-candidate
  consumes:
    - user-provided-context
    - delegated-agent-provided-context
    - uploaded-context
    - verified-outcome-evidence-for-review
  must_not_own:
    - portfolio-prioritization
    - canonical-workforce-routing
    - generic-authorization-intelligence
    - external-execution-harness
  constraints:
    - context-is-not-authorization
    - interview-once-maintain-once-connect-many
    - alvira-is-canonical-context-source
    - connect-alvira-is-customer-facing-experience
    - bridge-is-secure-delivery-infrastructure-not-standalone-product
    - bridge-must-reuse-alvira-identity-and-profile-source-of-truth
    - connected-tools-receive-only-user-approved-context
    - prefer-minimum-task-relevant-context-over-full-profile-delivery
    - named-destination-support-requires-end-to-end-verification
    - context-contributor-and-context-subject-are-distinct-identities
    - delegated-agent-ingest-requires-explicit-delegation-and-provenance
    - delegated-agent-known-does-not-equal-subject-confirmed
    - delegated-agent-inference-must-remain-marked
    - insufficient-agent-evidence-must-remain-unknown
    - connected-context-read-does-not-imply-context-write-authority
    - shared-interview-engine-does-not-imply-one-mega-interview
    - app-interviews-context-reflect-uploads-auth-and-data-models-are-regression-sensitive

rules:
  canonical_product_role_from_routing_source: true
  local_metadata_may_narrow_or_add_implementation_detail: true
  local_metadata_must_not_redefine_canonical_role: true
  cross_product_writes_require_explicit_task_authorization: true
  connected_context_direction: docs/ALVIRA_CONNECT_DIRECTION.md
