name: AgentMail inbound reply rail

on:
  pull_request:
    paths:
      - "src/routes/api.agentmail.webhooks.ts"
      - "src/lib/agentmail-webhook.ts"
      - "src/lib/customer-email.ts"
      - "src/routes/-ownerCustomerInbox.ts"
      - "src/components/OwnerCustomerInbox.tsx"
      - "src/routes/__root.tsx"
      - "migrations/011_customer_email_inbox.sql"
      - "tests/agentmail-webhook.test.ts"
      - ".env.example"
      - ".github/workflows/agentmail-inbound.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/agentmail-webhook.test.ts
      - run: bun run build
