name: PR85 Reflect entry fix

on:
  push:
    branches:
      - codex/unify-context-multi-source

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Reflect start without typed topic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/app.tsx")
          text = path.read_text()

          old_handle = '''    const trimmed = (offering === "meos" && chapterSuggestions.length > 0)\n      ? [topic.trim(), ...chapterSuggestions].filter(Boolean).join(", ")\n      : topic.trim();'''
          new_handle = '''    const trimmed = (offering === "meos" && chapterSuggestions.length > 0)\n      ? [topic.trim(), ...chapterSuggestions].filter(Boolean).join(", ")\n      : offering === "meos"\n        ? topic.trim() || "My current chapter"\n        : topic.trim();'''

          old_button = '              disabled={!topic.trim()}\n'
          new_button = '              disabled={offering === "meos" ? false : !topic.trim()}\n'

          if old_handle not in text:
              raise SystemExit("Expected Reflect handleStart block was not found")
          if old_button not in text:
              raise SystemExit("Expected start button disabled condition was not found")

          text = text.replace(old_handle, new_handle, 1)
          text = text.replace(old_button, new_button, 1)
          path.write_text(text)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix(reflect): allow guided start without typed topic"
          git rm .github/workflows/alvira-pr85-reflect-fix.yml
          git commit -m "chore: remove temporary PR85 workflow"
          git push origin HEAD:codex/unify-context-multi-source
