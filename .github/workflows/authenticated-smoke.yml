name: ALVIRA authenticated smoke
on:
  push:
    branches: [codex/authenticated-smoke-20261121]
    paths: [.github/workflows/authenticated-smoke.yml]
  workflow_dispatch:
permissions: {}
jobs:
  sign-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      statuses: write
    steps:
      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install chromium
      - name: Verify standard account sign-in and session persistence
        env:
          ALVIRA_TEST_PASSWORD: ${{ secrets.ALVIRA_TEST_PASSWORD }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const origin = 'https://alviratech.vercel.app';
          const email = 'codex-smoke-1786676512909@example.com';
          const results = {};
          const check = async (name, fn) => {
            try { results[name] = (await fn()) || 'PASS'; }
            catch (error) { results[name] = 'FAIL (' + error.name + ')'; }
            console.log(name + ': ' + results[name]);
          };
          (async () => {
            const browser = await chromium.launch();
            try {
              const page = await browser.newPage();
              page.setDefaultTimeout(12000);
              const goto = p => page.goto(origin + p, { timeout: 20000 });
              const heading = name => page.getByRole('heading', { name, exact: true }).waitFor();
              const login = async () => {
                if (!process.env.ALVIRA_TEST_PASSWORD) throw new Error();
                await goto('/login?returnTo=%2Fdashboard');
                if (new URL(page.url()).origin !== origin) throw new Error();
                await page.locator('#email').fill(email);
                const password = process.env.ALVIRA_TEST_PASSWORD;
                await page.locator('#password').fill(password);
                await page.getByRole('button', { name: 'Sign in', exact: true }).click();
                await heading('Dashboard');
              };
              await check('guest dashboard guard', async () => {
                await goto('/dashboard');
                await heading('Sign in');
              });
              await check('sign-in and dashboard reload', async () => {
                await login();
                await page.reload();
                await heading('Dashboard');
              });
              if (results['sign-in and dashboard reload'] !== 'PASS') {
                process.exitCode = 1;
                return;
              }
              const existingDraft = await page.getByText('Interview in progress', { exact: true }).count();
              await check('account and plan display', async () => {
                await goto('/account');
                await heading('Account details');
                await page.getByText(email, { exact: true }).first().waitFor();
              });
              await check('Bridge connection management', async () => {
                await goto('/bridge');
                await heading('Authorize another AI client to read your ALVIRA Context.');
              });
              await check('checkout session creation without payment', async () => {
                await goto('/pricing');
                console.log('checkout pricing page reached');
                const response = await page.request.post(origin + '/api/stripe/checkout', {data: {plan: 'pro-monthly'}});
                console.log('checkout API HTTP ' + response.status());
                if (!response.ok()) return 'FAIL HTTP ' + response.status();
                const data = await response.json();
                const destination = new URL(data.url, origin);
                const mode = destination.pathname.includes('cs_test_') ? 'test' : destination.pathname.includes('cs_live_') ? 'live' : 'unknown';
                console.log('checkout destination ' + destination.origin + ' mode ' + mode);
                if (destination.origin === origin) {
                  await page.getByText(/test checkout|billing smoke|payment/i).first().waitFor();
                  return 'PASS internal checkout destination reached';
                }
                if (destination.hostname !== 'checkout.stripe.com' && destination.hostname !== 'buy.stripe.com') throw new Error();
              });
              await check('interview start and reload', async () => {
                await goto('/app');
                const answer = page.getByPlaceholder(/Type your answer/);
                const start = page.getByRole('button', { name: /Start (the conversation|interview)/i });
                await start.or(answer).first().waitFor();
                console.log('interview entry reached');
                if (await answer.isVisible()) {
                  await page.reload();
                  await answer.waitFor();
                  return 'PASS existing interview resumed after reload';
                }
                if (existingDraft) return 'SKIPPED existing dashboard draft preserved';
                await page.locator('main input[type="text"]:visible').first().fill('My editing workflow for a fictional community newsletter and how I decide which stories to publish.');
                console.log('interview topic entered');
                await start.click();
                console.log('interview started');
                try { await answer.waitFor({ timeout: 25000 }); console.log('interview first question loaded'); }
                catch {
                  for (const [label, pattern] of [['API key missing', /API Key Not Configured/], ['free limit', /limit reached|upgrade to continue/i], ['interview error', /something went wrong|try again/i]]) {
                    if (await page.getByText(pattern).first().isVisible()) return 'FAIL ' + label;
                  }
                  throw new Error();
                }
                await answer.fill('I edit a fictional community newsletter for neighbors. I prioritize timely stories, plain language, and actionable local information.');
                await answer.press('Enter');
                await page.waitForFunction(() => {
                  const field = [...document.querySelectorAll('textarea')].find(el => el.placeholder.includes('Type your answer'));
                  return field && !field.disabled && field.value === '';
                });
                console.log('interview sample answer submitted');
                await goto('/dashboard');
                await heading('Dashboard');
                const draft = page.getByRole('link', { name: /Continue interview/i }).first();
                await draft.waitFor();
                await draft.click();
                await answer.waitFor();
              });
              await check('sign-out and protected dashboard', async () => {
                await goto('/account');
                await page.getByRole('button', { name: 'Sign out', exact: true }).click();
                await goto('/dashboard');
                await heading('Sign in');
              });
              if (Object.values(results).some(value => value.startsWith('FAIL'))) process.exitCode = 1;
            } finally { await browser.close(); }
          })().catch(() => { console.error('FAIL: browser setup or audit harness'); process.exitCode = 1; });
          NODE
      - name: Record result on this commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="ALVIRA authenticated smoke" \
            -f description="Standard account login and dashboard reload" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
