name: ALVIRA authenticated smoke
on:
  push:
    branches: [codex/authenticated-smoke-20261121]
    paths: [.github/workflows/authenticated-smoke.yml]
  workflow_dispatch:
permissions: {}
jobs:
  sign-in:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      statuses: write
    steps:
      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="ALVIRA authenticated smoke" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Install browser runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx --no-install playwright install chromium
      - name: Verify disposable-account Bridge retrieval and revocation
        env:
          ALVIRA_TEST_PASSWORD: ${{ secrets.ALVIRA_TEST_PASSWORD }}
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          const {createHmac,createHash,randomBytes}=require('node:crypto');
          const origin='https://alviratech.vercel.app';
          const email='alvira-e2e-20261121@example.com';
          let stage='QA account login';
          (async()=>{
           const password=createHmac('sha256',process.env.ALVIRA_TEST_PASSWORD).update(email).digest('hex');
           const browser=await chromium.launch();
           try{
            const p=await browser.newPage();
            await p.goto(origin+'/login?returnTo=%2Fdashboard');
            await p.locator('#email').fill(email);
            await p.locator('#password').fill(password);
            await p.getByRole('button',{name:'Sign in',exact:true}).click();
            await p.getByRole('heading',{name:'Dashboard',exact:true}).waitFor();
            stage='save approved Context from dashboard';
            const save=p.getByRole('button',{name:'Save to Context',exact:true});
            const saved=p.getByRole('link',{name:/Connect AI/});
            await save.or(saved).first().waitFor();
            if(await save.isVisible()) await save.click();
            await saved.waitFor();
            console.log('PASS disposable Context saved and available to connect');
            stage='OAuth registration';
            const callback='http://127.0.0.1:8917/callback';
            const clientName='ALVIRA disposable QA '+process.env.GITHUB_RUN_ID;
            const registered=await p.request.post(origin+'/api/bridge/register',{data:{client_name:clientName,redirect_uris:[callback],application_type:'native',token_endpoint_auth_method:'none'}});
            if(registered.status()!==201)throw Error();
            const {client_id}=await registered.json();
            const verifier=randomBytes(32).toString('base64url');
            const state=randomBytes(24).toString('base64url');
            const params=new URLSearchParams({client_id,redirect_uri:callback,response_type:'code',code_challenge:createHash('sha256').update(verifier).digest('base64url'),code_challenge_method:'S256',state,scope:'context:read profile:read'});
            stage='user consent';
            await p.route(callback+'**',route=>route.fulfill({status:200,body:'QA callback'}));
            const consent=await p.goto(origin+'/api/bridge/authorize?'+params);
            console.log('Bridge consent HTTP '+consent.status()+' path '+new URL(p.url()).pathname);
            await p.getByRole('link',{name:/Authorize read access/i}).click({timeout:20000});
            await p.waitForURL(url=>url.origin+url.pathname===callback);
            const result=new URL(p.url()).searchParams;
            if(result.get('state')!==state||!result.get('code'))throw Error();
            stage='exchange OAuth code';
            const tokenResponse=await p.request.post(origin+'/api/bridge/token',{form:{grant_type:'authorization_code',client_id,redirect_uri:callback,code_verifier:verifier,code:result.get('code')}});
            if(!tokenResponse.ok())throw Error();
            const {access_token}=await tokenResponse.json();
            if(!access_token)throw Error();
            const client=await browser.newContext();
            const read=()=>client.request.post(origin+'/api/bridge/mcp',{headers:{Authorization:'Bearer '+access_token,Accept:'application/json, text/event-stream'},data:{jsonrpc:'2.0',id:1,method:'tools/call',params:{name:'get_alvira_context',arguments:{}}}});
            stage='retrieve approved goal spec from separate client';
            const initial=await read();
            const body=await initial.text();
            if(!initial.ok()||!/"goal_spec"/.test(body)||!body.includes('newsletter'))throw Error();
            console.log('PASS external client retrieved approved goal spec');
            stage='revoke connection';
            await p.goto(origin+'/bridge');
            await p.getByText(clientName,{exact:true}).waitFor();
            await p.getByRole('button',{name:'Revoke connection'}).click();
            await p.getByText(clientName,{exact:true}).waitFor({state:'hidden'});
            stage='verify revoked client rejected';
            if((await read()).status()!==401)throw Error();
            console.log('PASS revoked client rejected');
           }finally{await browser.close();}
          })().catch(e=>{console.error('FAIL '+stage+' ('+e.name+')');process.exitCode=1;});
          NODE
      - name: Record result on this commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" -f context="ALVIRA authenticated smoke" \
            -f description="Disposable-account Bridge retrieval and revocation" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
