name: Bridge status correctness

on:
  pull_request:
    paths:
      - 'src/lib/bridge-context-status.ts'
      - 'src/lib/bridge.ts'
      - 'src/routes/api/bridge/context.ts'
      - 'src/routes/api/bridge/profiles.ts'
      - 'src/routes/api/bridge/mcp.ts'
      - 'src/routes/api/bridge/connections.ts'
      - 'src/routes/bridge/**'
      - 'tests/bridge-status.test.ts'
      - '.github/workflows/bridge-status.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/bridge-status.test.ts
      - run: bun run build
