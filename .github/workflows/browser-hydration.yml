name: Browser hydration correctness

on:
  pull_request:
    paths:
      - 'src/routes/__root.tsx'
      - 'src/components/AppFirstRunClarity.tsx'
      - 'tests/app-hydration.test.ts'
      - 'tests/hydration-browser.mjs'
      - '.github/workflows/browser-hydration.yml'

permissions:
  contents: read

jobs:
  browser-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun test tests/app-hydration.test.ts
      - run: bun run build
      - name: Install Chromium runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          bun run start > /tmp/alvira-server.log 2>&1 &
          echo $! > /tmp/alvira-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/alvira-server.log
          exit 1
      - name: Verify hydration in Chromium
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: node tests/hydration-browser.mjs
