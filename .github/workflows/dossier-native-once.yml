name: Migrate dossier section into route trees once

on:
  push:
    branches:
      - fix/hydration-e2e-regression

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hydration-e2e-regression
      - name: Move Dossier into native route trees
        run: |
          python3 - <<'PY'
          from pathlib import Path

          routes = {
              Path('src/routes/index.tsx'): '<DossierOwnershipPositioning />',
              Path('src/routes/context.tsx'): '<DossierOwnershipPositioning />',
              Path('src/routes/pricing.tsx'): '<DossierOwnershipPositioning compact />',
          }

          for path, element in routes.items():
              text = path.read_text()
              import_line = 'import { DossierOwnershipPositioning } from "~/components/DossierOwnershipPositioning";\n'
              if import_line not in text:
                  anchor = 'import { Header } from "~/components/Header";\n'
                  if anchor not in text:
                      raise SystemExit(f'missing Header import anchor in {path}')
                  text = text.replace(anchor, anchor + import_line, 1)
              marker = '      <TrustFooter />'
              insertion = f'      {element}\n{marker}'
              if element not in text:
                  if marker not in text:
                      raise SystemExit(f'missing TrustFooter anchor in {path}')
                  text = text.replace(marker, insertion, 1)
              path.write_text(text)

          root = Path('src/routes/__root.tsx')
          text = root.read_text()
          text = text.replace('import { DossierOwnershipPositioning } from "~/components/DossierOwnershipPositioning";\n', '')
          text = text.replace('      <DossierOwnershipPositioning />\n', '')
          text = text.replace('<html lang="en" suppressHydrationWarning>', '<html lang="en">')
          root.write_text(text)

          test = Path('tests/app-hydration.test.ts')
          text = test.read_text()
          old = '''  test("scopes hydration suppression to the root html element for the intentional theme class bootstrap", () => {\n    expect(root).toContain('<html lang="en" suppressHydrationWarning>');\n    expect((root.match(/suppressHydrationWarning/g) ?? []).length).toBe(1);\n    expect(clarity).not.toContain("suppressHydrationWarning");\n  });'''
          new = '''  test("does not mask hydration mismatches with suppression", () => {\n    expect(root).toContain('<html lang="en">');\n    expect(root).not.toContain("suppressHydrationWarning");\n    expect(clarity).not.toContain("suppressHydrationWarning");\n  });'''
          if old not in text:
              raise SystemExit('missing hydration suppression test anchor')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Commit native dossier placement
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/__root.tsx src/routes/index.tsx src/routes/context.tsx src/routes/pricing.tsx tests/app-hydration.test.ts
          git commit -m 'fix: render dossier natively in supported routes'
          git push
