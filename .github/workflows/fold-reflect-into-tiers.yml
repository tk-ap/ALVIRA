name: Fold Reflect into ALVIRA tiers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fold-reflect-into-tiers.yml

permissions:
  contents: write

jobs:
  integrate-reflect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fold core Reflect into ALVIRA tier access
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ent = Path('src/routes/-entitlements.server.ts')
          text = ent.read_text()
          old = '''export async function requireMeos(user: { id: string; email: string; tier: string }): Promise<void> {
  const hasComp = !!(await getMeosComp(user.email));
  const hasFoundingBeta = await hasActiveFoundingBeta(user.id);
  const ownerEmail = (process.env.ALVIRA_OWNER_EMAIL ?? "tahlia.ashwood@gmail.com").trim().toLowerCase();
  const isOwner = user.email.trim().toLowerCase() === ownerEmail;
  if (!hasComp && !hasFoundingBeta && !isOwner && !(await hasEntitlement(user.id, "meos_build"))) {
    throw new Error("Reflect Build must be purchased before continuing.");
  }
}
'''
          new = '''export async function requireMeos(user: { id: string; email: string; tier: string }): Promise<void> {
  if (!user?.id) throw new Error("Authentication required.");
  // Core ALVIRA Reflect is part of ALVIRA rather than a separately purchased product.
  // Existing meos_build/meos_comp records remain valid for backward compatibility,
  // while Free/Pro/Lifetime/Founding Beta accounts use their normal ALVIRA limits.
  await Promise.all([
    getMeosComp(user.email).catch(() => null),
    hasActiveFoundingBeta(user.id).catch(() => false),
    hasEntitlement(user.id, "meos_build").catch(() => false),
  ]);
}
'''
          if old not in text:
              raise SystemExit('requireMeos block not found')
          ent.write_text(text.replace(old, new, 1))

          meos = Path('src/routes/meos.tsx')
          text = meos.read_text()
          text = text.replace(
            'const reflectAuthorized = Boolean(user.isOwner || entitlements.includes("meos_build"));',
            'const reflectAuthorized = Boolean(user.isOwner || ["free", "pro", "lifetime", "founding_beta"].includes(user.tier) || entitlements.includes("meos_build"));',
            1,
          )
          pattern = re.compile(r'''\n        <section\n          className="border-y border-gray-200 bg-system-soft/50 dark:border-gray-800 dark:bg-ink/30"\n          aria-labelledby="pricing-heading"\n        >.*?\n        </section>''', re.S)
          replacement = '''
        <section
          className="border-y border-gray-200 bg-system-soft/50 dark:border-gray-800 dark:bg-ink/30"
          aria-labelledby="pricing-heading"
        >
          <div className="mx-auto max-w-4xl px-6 py-16 text-center">
            <SectionLabel>04 / Keep it living</SectionLabel>
            <h2 id="pricing-heading" className="mt-3 text-2xl font-semibold text-gray-900 dark:text-gray-100">
              Reflect is part of ALVIRA.
            </h2>
            <p className="mx-auto mt-4 max-w-2xl text-base leading-relaxed text-gray-600 dark:text-gray-400">
              ALVIRA Context captures and maintains what matters. ALVIRA Reflect is where you revisit that same Context, notice what changed, challenge an assumption, and deepen the understanding before putting it back to work.
            </p>
            <div className="mt-10 grid gap-4 text-left sm:grid-cols-2">
              <div className="border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-950">
                <p className="font-mono text-xs uppercase tracking-wider text-system-dark dark:text-system">Free</p>
                <p className="mt-3 text-sm leading-relaxed text-gray-600 dark:text-gray-400">Reflect is included within the Free plan's single saved Context and guided-interview limits, so you can experience the complete Context loop before upgrading.</p>
              </div>
              <div className="border border-system/40 bg-white p-5 dark:bg-gray-950">
                <p className="font-mono text-xs uppercase tracking-wider text-system-dark dark:text-system">Pro</p>
                <p className="mt-3 text-sm leading-relaxed text-gray-600 dark:text-gray-400">Full ongoing Reflect across multiple saved Contexts, with unlimited interviewing and continuous Context updates.</p>
              </div>
              <div className="border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-950">
                <p className="font-mono text-xs uppercase tracking-wider text-system-dark dark:text-system">Lifetime</p>
                <p className="mt-3 text-sm leading-relaxed text-gray-600 dark:text-gray-400">Core Reflect is included with the ALVIRA Context capabilities covered by your Lifetime plan.</p>
              </div>
              <div className="border border-iridescent/40 bg-white p-5 dark:bg-gray-950">
                <p className="font-mono text-xs uppercase tracking-wider text-iridescent-dark">Founding Beta</p>
                <p className="mt-3 text-sm leading-relaxed text-gray-600 dark:text-gray-400">Full customer-facing Reflect access is included as part of the Founding Beta entitlement.</p>
              </div>
            </div>
            <p className="mx-auto mt-8 max-w-2xl text-sm leading-relaxed text-gray-600 dark:text-gray-400">
              Optional symbolic frameworks remain optional lenses for self-reflection. They are not required to use Reflect and do not define your plan or access.
            </p>
            <a href="/pricing" className="mt-8 inline-flex items-center rounded-md bg-system-dark px-5 py-3 font-mono text-sm font-semibold text-white transition hover:bg-system">
              See ALVIRA plans <span className="ml-3" aria-hidden="true">→</span>
            </a>
          </div>
        </section>'''
          text2, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Reflect pricing section replacement count={count}')
          meos.write_text(text2)

          pricing = Path('src/routes/pricing.tsx')
          text = pricing.read_text()
          text = text.replace('"Continuous Context updates",', '"Continuous Context updates and ALVIRA Reflect",', 1)
          text = text.replace('"Context History — currently in beta",', '"Context History — currently in beta",\n  "Core ALVIRA Reflect included",', 1)
          text = text.replace('"3 guided interviews",', '"3 guided interviews",\n        "Basic ALVIRA Reflect on your saved Context",', 1)
          pricing.write_text(text)
          PY
      - name: Commit tier integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/-entitlements.server.ts src/routes/meos.tsx src/routes/pricing.tsx
          git commit -m "fold Reflect into ALVIRA tier access"
          git push origin HEAD:main
