name: Interview correctness

on:
  pull_request:
    paths:
      - 'src/routes/-validation.ts'
      - 'src/routes/-questionGenerator.ts'
      - 'src/routes/-interviewLab.ts'
      - 'src/routes/interview-lab.tsx'
      - 'src/routes/api/interview-lab/machine.ts'
      - 'src/lib/interview-lab.server.ts'
      - 'src/lib/interview-lab-machine.server.ts'
      - 'src/routes/app.tsx'
      - 'src/components/LiveContextMirror.tsx'
      - 'src/components/MeOSCTA.tsx'
      - 'src/lib/interview-prompts.ts'
      - 'src/lib/opportunity-candidates.ts'
      - 'src/routes/integrations.tsx'
      - 'tests/interview-prompts.test.ts'
      - 'tests/interview-lab-machine.test.ts'
      - 'docs/INTERVIEW_LAB_MACHINE_ACCESS.md'
      - 'tests/interview-topical-fit.test.ts'
      - 'tests/opportunity-candidates.test.ts'
      - '.github/workflows/interview-correctness.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/interview-prompts.test.ts tests/interview-lab-machine.test.ts tests/interview-topical-fit.test.ts tests/opportunity-candidates.test.ts
      - run: bun run build
