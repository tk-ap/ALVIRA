name: ALVIRA Brand Preview — GitHub Pages

on:
  push:
    branches:
      - brand/alvira-system-refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-brand-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ALVIRA
        run: bun run build

      - name: Render homepage snapshot for Pages
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'import handler from "./dist/server/server.js"; Bun.serve({ port: 4173, hostname: "127.0.0.1", fetch: handler.fetch }); await new Promise(() => {});' > /tmp/alvira-pages-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p _site
          curl --fail --silent --show-error http://127.0.0.1:4173/ > _site/index.html
          cp -R dist/client/. _site/
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('_site/index.html')
          html = path.read_text()

          # GitHub project Pages serves this repository under /ALVIRA/.
          html = re.sub(r'(href|src)="/(?!/)', r'\1="/ALVIRA/', html)

          # This branch preview is intentionally a static visual snapshot of the
          # existing SSR homepage. Remove hydration/runtime scripts so the Pages
          # copy cannot accidentally call production APIs or alter app behavior.
          html = re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I | re.S)
          html = re.sub(r'<link\b[^>]*rel=["\']modulepreload["\'][^>]*>', '', html, flags=re.I)

          path.write_text(html)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
