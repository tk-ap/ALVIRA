name: ALVIRA Brand Preview — GitHub Pages

on:
  push:
    branches:
      - brand/alvira-system-refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-brand-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build ALVIRA
        run: bun run build

      - name: Render branch homepage snapshot for Pages
        shell: bash
        run: |
          set -euo pipefail
          bun -e 'import handler from "./dist/server/server.js"; Bun.serve({ port: 4173, hostname: "127.0.0.1", fetch: handler.fetch }); await new Promise(() => {});' > /tmp/alvira-pages-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p _site
          curl --fail --silent --show-error http://127.0.0.1:4173/ > _site/index.html
          cp -R dist/client/. _site/
          touch _site/.nojekyll

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('_site/index.html')
          html = path.read_text()

          # The interactive app defaults to dark through its runtime theme logic.
          # Pages strips that runtime by design, so force the static review snapshot
          # into the same dark-first state for visual parity.
          html = html.replace('<html lang="en">', '<html lang="en" class="dark">', 1)

          # GitHub project Pages serves this repository under /ALVIRA/.
          html = re.sub(r'(href|src)="/(?!/)', r'\1="/ALVIRA/', html)

          # The Pages copy is a static branch-review snapshot. Remove hydration
          # and runtime scripts so it cannot call production APIs or alter app behavior.
          html = re.sub(r'<script\b[^>]*>.*?</script>', '', html, flags=re.I | re.S)
          html = re.sub(r'<link\b[^>]*rel=["\']modulepreload["\'][^>]*>', '', html, flags=re.I)

          # Re-introduce only preview-local visual behavior. This script manipulates
          # presentation state only; it has no access to app APIs, auth, persistence,
          # routing, uploads, interviews, Reflect, or other protected product behavior.
          preview_interaction = r'''
          <script>
          (() => {
            const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Portability is a structural visual treatment, not motion-only. Mark it
            // even when reduced motion is enabled so the network remains legible.
            const portabilitySection = [...document.querySelectorAll('main > section')]
              .find((section) => section.textContent.includes('Portable by design'));
            if (portabilitySection) {
              portabilitySection.dataset.scrollScene = 'portability';
              const destinations = ['ChatGPT','Claude','Gemini','Cursor','Your agents']
                .map((label) => [...portabilitySection.querySelectorAll('span')]
                  .find((el) => el.textContent.trim() === label))
                .filter(Boolean);
              const network = destinations[0] && destinations[0].parentElement;
              if (network) network.dataset.portabilityNetwork = 'true';
            }

            // --- scroll narrative ---
            if (!reducedMotion && 'IntersectionObserver' in window) {
              const root = document.documentElement;
              root.dataset.scrollEnhanced = 'true';

              const sceneLabels = [
                ['Why Context Intelligence', 'why-context'],
                ['Autonomy without context', 'autonomy'],
                ['Capability is not understanding', 'capability'],
                ['How ALVIRA builds context', 'sources'],
                ['A living system', 'living-loop'],
                ['Evidence of understanding', 'evidence'],
                ['Portable by design', 'portability'],
                ['Begin with context', 'final-cta']
              ];

              const exact = (section, selector, text) =>
                [...section.querySelectorAll(selector)].find((el) => el.textContent.trim() === text);
              const mark = (el) => { if (el) el.dataset.scrollStep = 'true'; };

              const sections = [...document.querySelectorAll('main > section')];
              const observed = [];

              sections.forEach((section) => {
                const match = sceneLabels.find(([label]) => section.textContent.includes(label));
                if (!match) return;
                const scene = match[1];
                section.dataset.scrollScene = scene;
                section.dataset.scrollReveal = 'true';

                if (scene === 'why-context') {
                  ['Goals','Constraints','History','Preferences','Decisions','Projects'].forEach((label) => mark(exact(section, 'div', label)));
                  const contextLabel = exact(section, 'p', 'ALVIRA Context');
                  mark(contextLabel && contextLabel.closest('div.border'));
                  const reusableLabel = exact(section, 'span', 'Reusable');
                  mark(reusableLabel && reusableLabel.closest('div.flex-1'));
                } else if (scene === 'autonomy') {
                  const first = [...section.querySelectorAll('p')].find((el) => el.textContent.startsWith('The system can move quickly'));
                  const second = exact(section, 'p', 'Context gives capability something to judge against.');
                  mark(first && first.parentElement);
                  mark(second && second.parentElement);
                } else if (scene === 'capability') {
                  ['Capability becomes generic.','Autonomy amplifies the gap.','Context turns raw capability into situated judgment.'].forEach((label) => {
                    const h = exact(section, 'h3', label); mark(h && h.parentElement);
                  });
                } else if (scene === 'sources') {
                  ['Conversation','Documents','Links','Files'].forEach((label) => {
                    const h = exact(section, 'h3', label); mark(h && h.parentElement);
                  });
                  const seed = exact(section, 'p', 'Seed what is known. Trust strong context. Ask only for genuine gaps.');
                  mark(seed && seed.parentElement);
                } else if (scene === 'evidence') {
                  ['Carried forward','Still uncertain','Changed','Ready to reuse'].forEach((label) => {
                    const h = exact(section, 'h3', label); mark(h && h.parentElement);
                  });
                } else if (scene === 'portability') {
                  const destinationNodes = ['ChatGPT','Claude','Gemini','Cursor','Your agents']
                    .map((label) => exact(section, 'span', label))
                    .filter(Boolean);
                  destinationNodes.forEach(mark);
                  const network = destinationNodes[0] && destinationNodes[0].parentElement;
                  if (network) {
                    network.dataset.portabilityNetwork = 'true';
                    mark(network);
                  }
                } else if (scene === 'final-cta') {
                  mark(section.querySelector('h2'));
                  mark(section.querySelector('h2') && section.querySelector('h2').nextElementSibling);
                  mark(section.querySelector('a[href="/app"]'));
                }

                [...section.querySelectorAll('[data-scroll-step="true"]')].forEach((step, index) => {
                  step.style.setProperty('--scroll-delay', Math.min(index * 85, 425) + 'ms');
                });
                observed.push(section);
              });

              const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                  const section = entry.target;
                  const visible = entry.isIntersecting && entry.intersectionRatio >= .08;
                  section.dataset.scrollInView = visible ? 'true' : 'false';
                  if (visible) section.dataset.scrollVisible = 'true';
                });
              }, { threshold: [0,.08,.2,.4,.65], rootMargin: '-6% 0px -10% 0px' });

              observed.forEach((section) => observer.observe(section));
            }

            // --- living context cycle ---
            const system = document.getElementById('system');
            if (!system) return;

            const fiveColumnGrids = [...system.querySelectorAll('div')]
              .filter((el) => el.classList.contains('sm:grid-cols-5'));
            if (fiveColumnGrids.length < 2) return;

            const stageGrid = fiveColumnGrids[0];
            const detailGrid = fiveColumnGrids[fiveColumnGrids.length - 1];
            const stages = [...stageGrid.querySelectorAll('button')].slice(0, 5);
            const details = [...detailGrid.querySelectorAll('button')].slice(0, 5);
            if (stages.length !== 5 || details.length !== 5) return;

            const labels = ['Capture', 'Understand', 'Reflect', 'Update', 'Reuse'];
            const outputs = [
              'New evidence enters the context layer without erasing what is already known.',
              'Signals become structured understanding: what is established, uncertain, changing, or missing.',
              'Patterns, contradictions, and meaningful changes are surfaced for review instead of disappearing between interactions.',
              'Confirmed changes become part of the maintained context model, preserving history while keeping the present accurate.',
              'Appropriate context becomes portable into the next AI interaction — then new evidence starts the cycle again.'
            ];

            const activeLabel = [...system.querySelectorAll('p')].find((el) => el.textContent.trim() === 'Active stage');
            const activeRow = activeLabel && activeLabel.parentElement;
            const activeStage = activeRow && activeRow.querySelector('span');
            const outputCopy = activeRow && activeRow.parentElement && activeRow.parentElement.querySelector('p.mt-2');
            const liveStatus = [...system.querySelectorAll('span')].find((el) => ['Live cycle','Paused'].includes(el.textContent.trim()));

            let active = 0;
            let interval = null;
            let resumeTimer = null;
            let inView = false;

            function render(index) {
              active = index;
              stages.forEach((stage, i) => {
                stage.setAttribute('aria-pressed', i === active ? 'true' : 'false');
                stage.style.opacity = i === active ? '1' : '.48';
                stage.style.transform = i === active ? 'translateY(-3px)' : 'translateY(0)';
              });
              details.forEach((detail, i) => {
                detail.style.opacity = i === active ? '1' : '.35';
              });
              if (activeStage) activeStage.textContent = `0${active + 1} / ${labels[active]}`;
              if (outputCopy) outputCopy.textContent = outputs[active];
            }

            function stop(status = 'Paused') {
              clearInterval(interval);
              interval = null;
              if (liveStatus) liveStatus.textContent = status;
            }

            function start() {
              if (reducedMotion || !inView) return;
              clearInterval(interval);
              interval = setInterval(() => render((active + 1) % stages.length), 2800);
              if (liveStatus) liveStatus.textContent = 'Live cycle';
            }

            function pauseThenResume() {
              stop();
              clearTimeout(resumeTimer);
              if (!reducedMotion) resumeTimer = setTimeout(start, 8000);
            }

            [...stages, ...details].forEach((control, index) => {
              const stageIndex = index % 5;
              control.addEventListener('click', () => { render(stageIndex); pauseThenResume(); });
            });

            if (reducedMotion) {
              inView = true;
              stop('Motion reduced');
            } else if ('IntersectionObserver' in window) {
              const loopObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                  inView = entry.isIntersecting && entry.intersectionRatio >= .08;
                  if (inView) start(); else stop('Waiting for view');
                });
              }, { threshold: [0,.08,.2,.4], rootMargin: '-6% 0px -10% 0px' });
              loopObserver.observe(system);
            } else {
              inView = true;
              start();
            }

            render(0);
          })();
          </script>
          '''

          html = html.replace('</body>', preview_interaction + '\n</body>', 1)
          path.write_text(html)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy branch homepage
        id: deployment
        uses: actions/deploy-pages@v4
