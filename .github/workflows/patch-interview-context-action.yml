name: Patch interview context action

on:
  push:
    branches:
      - brand/alvira-system-refresh
    paths:
      - .github/workflows/patch-interview-context-action.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/alvira-system-refresh
          fetch-depth: 0

      - name: Move Add context beside Generate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/app.tsx')
          text = path.read_text()

          replacements = [
              (
                  '          <div className="relative mx-auto w-full max-w-3xl flex-1 flex flex-col py-6">\n            {offering && contextSourcePanel}\n\n            {/* Chat area */}\n',
                  '          <div className="relative mx-auto w-full max-w-3xl flex-1 flex flex-col py-6">\n            {/* Chat area */}\n',
                  1,
              ),
              (
                  '                <div className="flex gap-2">\n                  {hasGaps && state?.currentDomain && !waiting && (\n',
                  '                <div className="flex gap-2">\n                  {offering && (\n                    <button\n                      type="button"\n                      onClick={() => setShowContextSources((shown) => !shown)}\n                      aria-expanded={showContextSources}\n                      className="rounded px-2 py-1 font-mono text-xs text-gray-600 transition-colors hover:text-emerald-700 focus-visible:ring-2 focus-visible:ring-emerald-500/50 dark:text-gray-400 dark:hover:text-emerald-400 dark:focus-visible:ring-emerald-400/50"\n                    >\n                      {showContextSources ? "Hide context" : contextSources.length > 0 ? `Add context · ${contextSources.length}` : "Add context"}\n                    </button>\n                  )}\n                  {hasGaps && state?.currentDomain && !waiting && (\n',
                  1,
              ),
              (
                  '                </div>\n              </div>\n\n              {/* Generation error — visible so a failure is never a silent hang */}\n',
                  '                </div>\n              </div>\n\n              {showContextSources && offering && contextSourcePanel}\n\n              {/* Generation error — visible so a failure is never a silent hang */}\n',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Patch assertion failed: expected {expected} match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, expected)

          path.write_text(text)
          PY

      - name: Verify scope and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "src/routes/app.tsx"
          git diff -- src/routes/app.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "place Add context beside Generate"
          git push origin HEAD:brand/alvira-system-refresh
