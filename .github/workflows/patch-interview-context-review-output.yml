name: Patch interview context review output

on:
  push:
    branches:
      - brand/alvira-system-refresh
    paths:
      - .github/workflows/patch-interview-context-review-output.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/alvira-system-refresh
          fetch-depth: 0

      - name: Apply narrow review-output patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/app.tsx')
          text = path.read_text()

          old = '''      setSeedSource("source");\n      setExtraction(result);\n      setSeedDecisions({});\n      if (screen === "interview") setSeedReviewOverlay(true);\n      else setScreen("seed-review");\n'''
          new = '''      setSeedSource("source");\n      setExtraction(result);\n      setSeedDecisions({});\n      if (screen === "interview") {\n        setShowContextSources(false);\n        setSeedReviewOverlay(true);\n      } else {\n        setScreen("seed-review");\n      }\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one URL review transition, found {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''  // ── Render helpers ──\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'Render helper marker mismatch: {text.count(marker)}')

          tray = '''  const interviewContextSourceTray = (\n    <section className="mb-4 rounded-lg border border-gray-200 bg-gray-50/70 p-3 dark:border-gray-700 dark:bg-gray-900/70" aria-label="Add context">\n      <div className="flex items-center justify-between gap-3">\n        <div>\n          <span className="font-mono text-[10px] uppercase tracking-wide text-emerald-700 dark:text-emerald-400">&lt;add-context /&gt;</span>\n          {contextSources.length > 0 && <span className="ml-2 font-mono text-[10px] text-gray-500 dark:text-gray-400">{contextSources.length} attached</span>}\n        </div>\n        <button type="button" onClick={() => setShowContextSources(false)} className="rounded px-2 py-1 font-mono text-[10px] text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">Close</button>\n      </div>\n      <div className="mt-3 grid gap-2 sm:grid-cols-3">\n        {CONTEXT_SOURCE_OPTIONS.map((option) => <button key={option.type} type="button" onClick={() => { setContextSourceType(option.type); if (option.type === "interview") inputRef.current?.focus(); if (option.type === "file" || option.type === "ai-context") fileInputRef.current?.click(); }} className={`rounded-md border p-2.5 text-left ${contextSourceType === option.type ? "border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/20" : "border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-950"}`}><span className="block text-xs font-semibold">{option.label}</span><span className="mt-1 block text-[10px] leading-relaxed text-gray-500">{option.examples}</span></button>)}\n      </div>\n      {(contextSourceType === "website" || contextSourceType === "professional" || contextSourceType === "social") && <form onSubmit={(event) => { event.preventDefault(); void addContextUrl(); }} className="mt-3 flex gap-2"><input value={contextSourceLocator} onChange={(event) => setContextSourceLocator(event.target.value)} placeholder="https://…" aria-label="Context source URL" className="min-w-0 flex-1 rounded-md border border-gray-300 bg-white px-3 py-2 text-sm dark:border-gray-700 dark:bg-gray-950" /><button type="submit" disabled={uploading || !contextSourceLocator.trim()} className="rounded-md bg-gray-900 px-4 py-2 text-xs font-semibold text-white disabled:opacity-50 dark:bg-gray-100 dark:text-gray-900">{uploading ? "Reading…" : "Review & attach"}</button></form>}\n      {(contextSourceType === "file" || contextSourceType === "ai-context") && <p className="mt-3 text-xs text-gray-600 dark:text-gray-400">Choose a file to extract and review before it becomes part of this Context.</p>}\n      {uploadError && <p role="alert" className="mt-3 text-xs text-red-600 dark:text-red-400">{uploadError}</p>}\n      {contextSessionNotice && <p role="status" className="mt-3 text-xs text-emerald-700 dark:text-emerald-400">{contextSessionNotice}</p>}\n    </section>\n  );\n\n'''
          text = text.replace(marker, tray + marker, 1)

          old_use = '''              {showContextSources && offering && contextSourcePanel}\n'''
          new_use = '''              {showContextSources && offering && interviewContextSourceTray}\n'''
          if text.count(old_use) != 1:
              raise SystemExit(f'Expected one interview context panel use, found {text.count(old_use)}')
          text = text.replace(old_use, new_use, 1)

          path.write_text(text)
          PY

      - name: Verify scope and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = "src/routes/app.tsx"
          grep -q 'const interviewContextSourceTray' src/routes/app.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "restore context review output"
          git push origin HEAD:brand/alvira-system-refresh

# run 2
