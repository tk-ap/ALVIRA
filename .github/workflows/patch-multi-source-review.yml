name: Patch multi-source review

on:
  push:
    branches:
      - brand/alvira-system-refresh
    paths:
      - .github/workflows/patch-multi-source-review.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/alvira-system-refresh
          fetch-depth: 0

      - name: Apply narrow source-review patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/app.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  const seedOfferingRef = useRef<"context" | "meos">("context");\n',
                  '  const seedOfferingRef = useRef<"context" | "meos">("context");\n  const pendingContextSourceRef = useRef<ContextSource | null>(null);\n',
                  1,
              ),
              (
                  '      addContextSource(source);\n',
                  '      pendingContextSourceRef.current = source;\n',
                  1,
              ),
              (
                  '    } finally {\n      setWaiting(false);\n    }\n  };\n\n  const handleSend = async () => {\n',
                  '    } finally {\n      setWaiting(false);\n      if (seedSource === "source" && pendingContextSourceRef.current) {\n        const approvedSource = pendingContextSourceRef.current;\n        pendingContextSourceRef.current = null;\n        addContextSource(approvedSource);\n      }\n    }\n  };\n\n  const handleSend = async () => {\n',
                  1,
              ),
              (
                  '          onClose={() => { setSeedReviewOverlay(false); setExtraction(null); setSeedDecisions({}); }}\n',
                  '          onClose={() => { setSeedReviewOverlay(false); setExtraction(null); setSeedDecisions({}); pendingContextSourceRef.current = null; setContextSourceLocator(""); }}\n',
                  1,
              ),
              (
                  '        <SignupPromptBanner show={authUser === null} />\n        <TrustFooter />\n      </div>\n    );\n  }\n\n  // ── Render: Seed Review Screen (upload → claim review → seed) ──\n',
                  '        <SignupPromptBanner show={authUser === null} />\n        <TrustFooter />\n        {seedReviewOverlay && extraction && <SeedReviewOverlay\n          extraction={extraction}\n          decisions={seedDecisions}\n          onDecision={(index, status) => setSeedDecisions((current) => ({ ...current, [index]: { status, text: current[index]?.text } }))}\n          onRevise={(index, text) => setSeedDecisions((current) => ({ ...current, [index]: { status: "revise", text } }))}\n          onClose={() => { setSeedReviewOverlay(false); setExtraction(null); setSeedDecisions({}); pendingContextSourceRef.current = null; setContextSourceLocator(""); }}\n          onContinue={() => void handleSeedContinue()}\n          waiting={waiting}\n        />}\n      </div>\n    );\n  }\n\n  // ── Render: Seed Review Screen (upload → claim review → seed) ──\n',
                  1,
              ),
              (
                  '    setExtraction(null);\n    setSeedDecisions({});\n    setSeededInfo(null);\n',
                  '    setExtraction(null);\n    setSeedDecisions({});\n    pendingContextSourceRef.current = null;\n    setContextSourceLocator("");\n    setSeededInfo(null);\n',
                  1,
              ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'Patch assertion failed: expected {expected} match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, expected)

          path.write_text(text)
          PY

      - name: Verify scope and commit
        shell: bash
        run: |
          git diff --check
          git diff -- src/routes/app.tsx
          test "$(git diff --name-only | tr -d '\r')" = "src/routes/app.tsx"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git commit -m "fix multi-source review flow"
          git push origin HEAD:brand/alvira-system-refresh
