name: Patch tier test switcher

on:
  push:
    branches: [main]
    paths: [.github/workflows/patch-tier-test-switcher.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply test access-mode patch
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path('src/routes/-auth.ts')
          text = auth.read_text()

          old = '''function isOwnerUser(user: { email: string }): boolean { const ownerEmail = (process.env.ALVIRA_OWNER_EMAIL ?? "tahlia.ashwood@gmail.com").trim().toLowerCase(); return user.email.trim().toLowerCase() === ownerEmail; }\n'''
          new = '''function isOwnerUser(user: { email: string }): boolean { const ownerEmail = (process.env.ALVIRA_OWNER_EMAIL ?? "tahlia.ashwood@gmail.com").trim().toLowerCase(); return user.email.trim().toLowerCase() === ownerEmail; }\nconst TEST_ACCESS_COOKIE = "alvira_test_access";\ntype TestAccessMode = "actual" | "founder" | "free" | "pro" | "lifetime";\nconst TEST_ACCESS_EMAILS = new Set(["codex-smoke-1786676512909@example.com", "alvira@agentmail.to"]);\nfunction isAccessTestUser(user: { email: string }): boolean { return isOwnerUser(user) || TEST_ACCESS_EMAILS.has(user.email.trim().toLowerCase()); }\nfunction testAccessCookieOptions() { const domain = process.env.ALVIRA_SESSION_COOKIE_DOMAIN?.trim(); return { path: "/", maxAge: SESSION_MAX_AGE, httpOnly: true, secure: process.env.NODE_ENV === "production", sameSite: "lax" as const, ...(domain ? { domain } : {}) }; }\nfunction getTestAccessMode(user: { email: string }): TestAccessMode | null { if (!isAccessTestUser(user)) return null; let raw: string | null = null; try { raw = getCookie(TEST_ACCESS_COOKIE) ?? null; } catch {} if (raw === "actual" || raw === "founder" || raw === "free" || raw === "pro" || raw === "lifetime") return raw; return isOwnerUser(user) ? "founder" : "actual"; }\nfunction getEffectiveTier(user: { email: string; tier: string }): string { const mode = getTestAccessMode(user); return mode === "free" || mode === "pro" || mode === "lifetime" ? mode : user.tier; }\nfunction hasFounderAccess(user: { email: string }): boolean { return getTestAccessMode(user) === "founder"; }\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''export const logout = createServerFn({ method: "POST" }).handler(async () => { const token = getSessionTokenFromRequest(); if (token) await deleteSession(token); try { deleteCookie(SESSION_COOKIE, sessionCookieOptions()); } catch {} return { success: true }; });'''
          new = '''export const logout = createServerFn({ method: "POST" }).handler(async () => { const token = getSessionTokenFromRequest(); if (token) await deleteSession(token); try { deleteCookie(SESSION_COOKIE, sessionCookieOptions()); deleteCookie(TEST_ACCESS_COOKIE, testAccessCookieOptions()); } catch {} return { success: true }; });'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          text = text.replace('''if ((isOwnerUser(user) || await getMeosComp(user.email))''', '''if ((hasFounderAccess(user) || await getMeosComp(user.email))''', 1)
          text = text.replace('''if (isOwnerUser(user)) return { authorized: true };''', '''if (hasFounderAccess(user)) return { authorized: true };''', 1)

          old = '''export const saveProfile = createServerFn({ method: "POST" }).validator((data: unknown) => { const d = data as { topic?: string; tier?: string; state?: unknown; portrait?: unknown; offering?: string; preview?: boolean }; if (!d.topic || typeof d.topic !== "string" || !d.tier || !d.state) throw new Error("Topic, tier, and state are required."); return { topic: d.topic.trim(), tier: d.tier, state: d.state, portrait: d.portrait, preview: d.preview === true, offering: d.offering === "meos" ? "meos" as const : "context" as const }; }).handler(async ({ data }) => { const user = await requireUser(); const owner = isOwnerUser(user); if (data.offering === "meos" && !data.preview && !owner) { const { requireMeos } = await import("./-entitlements.server"); await requireMeos(user); } const d = getDb(); const existing = (await d.query("SELECT id FROM profiles WHERE user_id = $1 AND topic = $2", [user.id, data.topic]))[0] as { id: string } | undefined; if (!owner && user.tier === "free" && !existing) { const count = await getProfileCount(user.id); if (count >= 1) return { error: "limit_reached", limit: "profiles" }; }'''
          new = '''export const saveProfile = createServerFn({ method: "POST" }).validator((data: unknown) => { const d = data as { topic?: string; tier?: string; state?: unknown; portrait?: unknown; offering?: string; preview?: boolean }; if (!d.topic || typeof d.topic !== "string" || !d.tier || !d.state) throw new Error("Topic, tier, and state are required."); return { topic: d.topic.trim(), tier: d.tier, state: d.state, portrait: d.portrait, preview: d.preview === true, offering: d.offering === "meos" ? "meos" as const : "context" as const }; }).handler(async ({ data }) => { const user = await requireUser(); const founderAccess = hasFounderAccess(user); const effectiveTier = getEffectiveTier(user); if (data.offering === "meos" && !data.preview && !founderAccess) { const { requireMeos } = await import("./-entitlements.server"); await requireMeos(user); } const d = getDb(); const existing = (await d.query("SELECT id FROM profiles WHERE user_id = $1 AND topic = $2", [user.id, data.topic]))[0] as { id: string } | undefined; if (!founderAccess && effectiveTier === "free" && !existing) { const count = await getProfileCount(user.id); if (count >= 1) return { error: "limit_reached", limit: "profiles" }; }'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''if (!isOwnerUser(user) && user.tier === "free" && !existing && await getProfileCount(user.id) >= 1) return { error: "limit_reached", limit: "profiles" };'''
          new = '''const effectiveTier = getEffectiveTier(user); if (!hasFounderAccess(user) && effectiveTier === "free" && !existing && await getProfileCount(user.id) >= 1) return { error: "limit_reached", limit: "profiles" };'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''export const getCurrentUser = createServerFn({ method: "GET" }).handler(async () => { await deleteExpiredSessions(); const token = getSessionTokenFromRequest(); if (!token) return null; const session = await getSessionByToken(token); if (!session) return null; if (new Date(session.expires_at) < new Date()) { await deleteSession(token); return null; } const user = await getUserById(session.user_id); if (!user) return null; return { id: user.id, email: user.email, tier: user.tier, interviewCount: user.interview_count, isOwner: isOwnerUser(user) }; });'''
          new = '''export const getCurrentUser = createServerFn({ method: "GET" }).handler(async () => { await deleteExpiredSessions(); const token = getSessionTokenFromRequest(); if (!token) return null; const session = await getSessionByToken(token); if (!session) return null; if (new Date(session.expires_at) < new Date()) { await deleteSession(token); return null; } const user = await getUserById(session.user_id); if (!user) return null; const accessMode = getTestAccessMode(user); return { id: user.id, email: user.email, tier: getEffectiveTier(user), interviewCount: user.interview_count, isOwner: isOwnerUser(user), canTestAccess: isAccessTestUser(user), accessMode }; });\nexport const setTestAccessTier = createServerFn({ method: "POST" }).validator((data: unknown) => { const mode = (data as { mode?: string }).mode; if (mode !== "actual" && mode !== "founder" && mode !== "free" && mode !== "pro" && mode !== "lifetime") throw new Error("Unsupported test access mode."); return mode as TestAccessMode; }).handler(async ({ data }) => { const user = await requireUser(); if (!isAccessTestUser(user)) throw new Error("Not authorized."); setCookie(TEST_ACCESS_COOKIE, data, testAccessCookieOptions()); return { success: true, accessMode: data, tier: getEffectiveTier(user) }; });'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''  const user = await requireUser();\n  if (isOwnerUser(user)) return { interviewCount: user.interview_count, tier: user.tier, isOwner: true };'''
          new = '''  const user = await requireUser();\n  const effectiveTier = getEffectiveTier(user);\n  if (hasFounderAccess(user)) return { interviewCount: user.interview_count, tier: effectiveTier, isOwner: isOwnerUser(user), accessMode: getTestAccessMode(user) };'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          text = text.replace('''if (user.tier === "free" && user.interview_count >= 3)''', '''if (effectiveTier === "free" && user.interview_count >= 3)''', 1)
          text = text.replace('''return { interviewCount: newCount, tier: user.tier };''', '''return { interviewCount: newCount, tier: effectiveTier };''', 1)

          old = '''export const fetchUserLimits = createServerFn({ method: "GET" }).handler(async () => { const user = await requireUser(); const limits = await getUserLimits(user.id); if (!limits) throw new Error("User not found."); const owner = isOwnerUser(user); return { ...limits, isOwner: owner, ...(owner ? { maxInterviews: Number.MAX_SAFE_INTEGER, maxProfiles: Number.MAX_SAFE_INTEGER } : {}) }; });'''
          new = '''export const fetchUserLimits = createServerFn({ method: "GET" }).handler(async () => { const user = await requireUser(); const limits = await getUserLimits(user.id); if (!limits) throw new Error("User not found."); const accessMode = getTestAccessMode(user); const effectiveTier = getEffectiveTier(user); const unlimited = accessMode === "founder" || effectiveTier !== "free"; return { ...limits, tier: effectiveTier, isOwner: isOwnerUser(user), canTestAccess: isAccessTestUser(user), accessMode, maxInterviews: unlimited ? Number.MAX_SAFE_INTEGER : 3, maxProfiles: unlimited ? Number.MAX_SAFE_INTEGER : 1 }; });'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          auth.write_text(text)

          account = Path('src/routes/account.tsx')
          text = account.read_text()
          text = text.replace('''import { getCurrentUser, fetchUserLimits, logout, getEntitlements, claimPurchase } from "./-auth";''', '''import { getCurrentUser, fetchUserLimits, logout, getEntitlements, claimPurchase, setTestAccessTier } from "./-auth";''', 1)
          text = text.replace('''  isOwner?: boolean;\n}''', '''  isOwner?: boolean;\n  canTestAccess?: boolean;\n  accessMode?: "actual" | "founder" | "free" | "pro" | "lifetime" | null;\n}''', 1)
          text = text.replace('''${tierBadgeClass[limits.isOwner ? "founder" : limits.tier] || tierBadgeClass.free}`}>\n                      {limits.isOwner ? "FOUNDER" : limits.tier}''', '''${tierBadgeClass[limits.accessMode === "founder" ? "founder" : limits.tier] || tierBadgeClass.free}`}>\n                      {limits.accessMode === "founder" ? "FOUNDER" : limits.tier}''', 1)
          text = text.replace('''{limits.isOwner ? `${limits.interviewCount} / Unlimited` : `${limits.interviewCount}${limits.maxInterviews < Infinity ? ` / ${limits.maxInterviews}` : ""}`}''', '''{limits.maxInterviews >= Number.MAX_SAFE_INTEGER ? `${limits.interviewCount} / Unlimited` : `${limits.interviewCount} / ${limits.maxInterviews}`}''', 1)
          text = text.replace('''{limits.isOwner ? `${limits.profileCount} / Unlimited` : `${limits.profileCount}${limits.maxProfiles < Infinity ? ` / ${limits.maxProfiles}` : ""}`}''', '''{limits.maxProfiles >= Number.MAX_SAFE_INTEGER ? `${limits.profileCount} / Unlimited` : `${limits.profileCount} / ${limits.maxProfiles}`}''', 1)

          marker = '''              {/* Upgrade section */}\n'''
          panel = '''              {limits.canTestAccess && (\n                <div className="rounded-lg border border-iridescent/60 dark:border-iridescent-dark/60 bg-iridescent-soft/30 overflow-hidden">\n                  <div className="px-5 py-4 border-b border-iridescent/30 dark:border-iridescent-dark/30">\n                    <h2 className="font-semibold text-gray-900 dark:text-gray-100">Test access tier</h2>\n                    <p className="mt-1 text-xs text-gray-500 dark:text-gray-400">Session-only simulation. This does not change the account's stored billing tier.</p>\n                  </div>\n                  <div className="px-5 py-4 flex flex-wrap gap-2">\n                    {(["founder", "free", "pro", "lifetime", "actual"] as const).map((mode) => (\n                      <button key={mode} type="button" onClick={async () => { await setTestAccessTier({ data: { mode } }); await loadLimits(); }} className={`rounded-md border px-3 py-2 font-mono text-xs uppercase tracking-wide transition-colors ${limits.accessMode === mode ? "border-iridescent bg-iridescent-soft text-iridescent-dark dark:border-iridescent-dark dark:text-iridescent-dark" : "border-gray-300 text-gray-600 hover:border-gray-500 dark:border-gray-700 dark:text-gray-400"}`}>\n                        {mode}\n                      </button>\n                    ))}\n                  </div>\n                </div>\n              )}\n\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, panel + marker, 1)

          old = '''              {limits.tier === "free" ? ('''
          new = '''              {limits.accessMode === "founder" ? (\n                <div className="rounded-lg border border-iridescent dark:border-iridescent-dark bg-iridescent-soft/30 overflow-hidden">\n                  <div className="px-5 py-4"><h2 className="font-semibold text-gray-900 dark:text-gray-100">Founder access</h2><p className="mt-1 text-sm text-gray-600 dark:text-gray-400">Full product access for owner and controlled acceptance testing.</p></div>\n                </div>\n              ) : limits.tier === "free" ? ('''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          account.write_text(text)
          PY
      - name: Verify and commit
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/routes/-auth.ts src/routes/account.tsx "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/-auth.ts src/routes/account.tsx
          git commit -m "add controlled tier test switcher"
          git push origin main
