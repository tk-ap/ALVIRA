name: PR85 Reflect fix

on:
  push:
    branches:
      - codex/unify-context-multi-source

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Reflect start fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/routes/app.tsx")
          s = p.read_text()
          old1 = '    if (!trimmed) return;'
          new1 = '    if (offering !== "meos" && !trimmed) return;'
          old2 = '    const initialState = createInitialState(tier, trimmed, offering === "meos" ? "meos" : "context", isPreview);'
          new2 = '    const initialState = createInitialState(tier, trimmed || "My current chapter", offering === "meos" ? "meos" : "context", isPreview);'
          if old1 not in s:
              raise SystemExit("target 1 not found")
          if old2 not in s:
              raise SystemExit("target 2 not found")
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit Reflect fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/app.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: allow Reflect to start without a prompt"
          git push
