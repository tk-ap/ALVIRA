name: PR85 Reflect fix

on:
  push:
    paths:
      - '.github/workflows/pr85-reflect-fix.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unify-context-multi-source
          fetch-depth: 0
      - name: Apply targeted Reflect fix and repair initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/app.tsx')
          s = p.read_text()
          replacements = [
              ('const initialState = createInitialState(   tier,   trimmed || "My current chapter",   offering === "meos" ? "meos" : "context",   isPreview );',
               'const initialState = createInitialState(existing.tier, existing.topic, offering, preview);'),
              ('if (offering !== "meos" && !trimmed) return;',
               'if (offering !== "meos" && !trimmed) return;'),
              ('const initialState = createInitialState(   tier,   trimmed || "My current chapter",   offering === "meos" ? "meos" : "context",   isPreview );',
               'const initialState = createInitialState(tier, trimmed, offering === "meos" ? "meos" : "context", isPreview);'),
              ('disabled={!topic.trim()}',
               'disabled={offering !== "meos" && !topic.trim()}'),
          ]
          # The first malformed initializer is unique to seedStateFromExisting.
          old_seed = 'const initialState = createInitialState(   tier,   trimmed || "My current chapter",   offering === "meos" ? "meos" : "context",   isPreview );'
          if old_seed in s:
              s = s.replace(old_seed, 'const initialState = createInitialState(existing.tier, existing.topic, offering, preview);', 1)
          old_start = 'const initialState = createInitialState(   tier,   trimmed || "My current chapter",   offering === "meos" ? "meos" : "context",   isPreview );'
          if old_start in s:
              s = s.replace(old_start, 'const initialState = createInitialState(tier, trimmed, offering === "meos" ? "meos" : "context", isPreview);', 1)
          s = s.replace('disabled={!topic.trim()}', 'disabled={offering !== "meos" && !topic.trim()}')
          p.write_text(s)
          PY
          git diff --check
          git diff -- src/routes/app.tsx
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/app.tsx
          git diff --cached --quiet || git commit -m 'fix: allow Reflect to start without a prompt'
          git push origin codex/unify-context-multi-source
