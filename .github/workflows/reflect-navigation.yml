name: Reflect navigation correctness

on:
  pull_request:
    paths:
      - 'src/components/Header.tsx'
      - 'src/components/MeOSCTA.tsx'
      - 'src/routes/app.tsx'
      - 'src/routes/meos.tsx'
      - 'tests/reflect-navigation.test.ts'
      - '.github/workflows/reflect-navigation.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tests/reflect-navigation.test.ts
      - run: bun run build
