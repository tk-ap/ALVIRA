<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" fill="none" role="img" aria-labelledby="title description">
  <title id="title">ALVIRA</title>
  <desc id="description">ALVIRA written as a refined open code tag with a six-segment context line.</desc>

  <!-- Opening context bracket: structure meeting a living signal. -->
  <path d="M92 51L41 100" stroke="#F3F4F2" stroke-width="13" stroke-linecap="round"/>
  <path d="M41 100L92 149" stroke="#65CDB5" stroke-width="13" stroke-linecap="round"/>

  <!-- Humanist wordmark keeps the code syntax from feeling purely mechanical. -->
  <text x="126" y="126"
        fill="#F3F4F2"
        font-family="'Avenir Next', Avenir, 'Helvetica Neue', Arial, sans-serif"
        font-size="78"
        font-weight="600"
        letter-spacing="12">ALVIRA</text>

  <!-- Closing tag: the slash carries the brand accent. -->
  <path d="M643 51L604 149" stroke="#65CDB5" stroke-width="13" stroke-linecap="round"/>
  <path d="M674 51L725 100L674 149" stroke="#F3F4F2" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Six orchestration stages, intentionally quiet at small sizes. -->
  <g stroke-width="4" stroke-linecap="round">
    <path d="M135 157H187" stroke="#65CDB5"/>
    <path d="M199 157H251" stroke="#65CDB5" stroke-opacity="0.82"/>
    <path d="M263 157H315" stroke="#F3F4F2" stroke-opacity="0.48"/>
    <path d="M327 157H379" stroke="#F3F4F2" stroke-opacity="0.38"/>
    <path d="M391 157H443" stroke="#F3F4F2" stroke-opacity="0.3"/>
    <path d="M455 157H507" stroke="#F3F4F2" stroke-opacity="0.22"/>
  </g>
</svg>
