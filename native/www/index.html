<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e0e" />
    <title>ALVIRA</title>
    <style>
      :root { color-scheme: dark; font-family: ui-sans-serif, system-ui, sans-serif; background: #0b0e0e; color: #f4f0e9; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(32rem, 100%); }
      .mark { width: 56px; height: 56px; margin-bottom: 24px; }
      h1 { font-size: 1.4rem; margin: 0 0 12px; }
      p { color: #b8ada1; line-height: 1.6; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./icon.svg" alt="" />
      <h1>ALVIRA Native</h1>
      <p>This fallback shell is bundled locally. Native 0.1 normally opens the production ALVIRA app origin so the first device test can prove the same account and Context without changing the web runtime.</p>
    </main>
  </body>
</html>
